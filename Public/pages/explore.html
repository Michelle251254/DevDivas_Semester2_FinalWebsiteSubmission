<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Explore the Replay music library: search and filter songs by genre, release year and rating.">
    <meta name="author" content="Danya van Meyeren 261140, Michelle Meyer 21100093">

    <title>Explore</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Rubik+Dirt&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/explore.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/filters.css">
    <link rel="stylesheet" href="../css/library.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-replay">
        <div class="container-fluid px-4">
            <a class="navbar-brand logo" href="index.html">REPLAY</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto gap-lg-5">
                    <li class="nav-item"><a class="nav-link" href="../pages/landingP.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../pages/explore.html">Explore</a></li>
                    <li class="nav-item"><a class="nav-link " href="../pages/playlist.html">Library</a></li>
                </ul>

                <form class="search-form d-flex align-items-center me-lg-3 my-3 my-lg-0" role="search"
                    onsubmit="return-false;">
                    <input id="searchInput" class="form-control" type="search" placeholder="Search"
                        aria-label="Search" />
                </form>

                <a href="#" class="avatar" aria-label="Your profile">JM</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid page-margin py-4">
        <h1>EXPLORE</h1>
    </div>


    <!==============CLARISHA'S HTML FOR FILTERS======================>
        <div class="libraryFilters page-margin">
            <select id="genreFilter">
                <option value="all">All Genres</option>
            </select>

            <select id="yearFilter">
                <option value="all">All Years</option>
            </select>

            <select id="ratingFilter">
                <option value="all">All Ratings</option>
                <option value="5">&#9733; 5 only</option>
                <option value="4.5">&#9733; 4.5 &amp; up</option>
                <option value="4">&#9733; 4 &amp; up</option>
            </select>

            <select id="sortFilter">
                <option value="default">Sort By</option>
                <option value="titleAZ">Title A-Z</option>
                <option value="artistAZ">Artist A-Z</option>
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="rating">Highest Rated</option>
            </select>
            <button type="button" id="showAllBtn" class="showAllBtn">Show All</button>
        </div>

        <!==============CLARISHA'S HTML FOR FILTERS======================>


            <div class="container libraryContainer">
                <p id="libraryCount" class="libraryCount"></p>
                <div class="row g-4" id="libraryGrid"></div>
            </div>




            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="../js/api.js"></script>
            <script src="../js/searchbar.js"></script>
            <script src="../js/filter.js"></script>


            <div class="modal fade" id="playlistModal" tabindex="-1" aria-labelledby="playlistModalLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content playlistModal">

                        <div class="modal-header playlistModalHeader">
                            <h2 class="modal-title playlistModalTitle" id="playlistModalLabel">Save to playlist</h2>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Close"></button>
                        </div>

                        <div class="modal-body">

                            <p class="playlistSongName" id="playlistSongName"></p>

                            <div id="playlistList"></div>

                            <p class="playlistLabel">Create a new playlist</p>

                            <div class="playlistCreateRow">
                                <input type="text" id="newPlaylistName" class="playlistInput"
                                    placeholder="Playlist name" maxlength="40">
                                <button type="button" id="createPlaylistBtn" class="playlistCreateBtn">Create</button>
                            </div>

                            <p class="playlistMessage" id="playlistMessage"></p>

                        </div>

                    </div>
                </div>
            </div>

            <div class="modal fade" id="savedModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div class="modal-content savedModal">
                        <div class="modal-body">
                            <p class="savedModalText">Your song has been saved</p>
                            <button type="button" class="savedModalBtn" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>

            <!--Michelle vdm-->
            <footer class="site-footer">
                <div
                    class="d-flex flex-column flex-md-row justify-content-md-between align-items-center text-center gap-1">
                    <span class="footer-brand">REPLAY</span>
                    <p class="footer-copy mb-0">
                        © 2026 Replay. Made with <span class="footer-heart">♥</span> by Dev Divas.
                    </p>
                </div>
            </footer>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


            <script src="../js/api.js"></script>
            <script src="../js/searchbar.js"></script>
            <script src="../js/filter.js"></script>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
