<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="music, replay, playlist, streaming" />
    <meta name="author" content="Michelle Meyer 21100093" />

    <title>SAVED SONGS</title>

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik+Dirt&display=swap"
        rel="stylesheet">

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <!--CSS-->
    <link rel="stylesheet" href="../css/explore.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/landingP.css" />
    <link rel="stylesheet" href="../css/songInfo.css" />
    <link rel="stylesheet" href="../css/playlist.css" />
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-replay">
        <div class="container-fluid page-margin">
            <a class="navbar-brand logo" href="landingP.html">REPLAY</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto gap-lg-5">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pages/explore.html">Explore</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/pages/playlist.html">Saved</a></li>
                </ul>

                <form class="search-form d-flex align-items-center me-lg-3 my-3 my-lg-0" role="search">
                    <input id="searchInput" class="form-control" type="search" placeholder="Search"
                        aria-label="Search" />
                </form>

                <a href="#" class="avatar" aria-label="Your profile">JM</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid page-margin playlistContainer">
        <a class="backToLibrary" href="explore.html">
            <p>
                <i class="fa-solid fa-arrow-left"></i>
            </p>
            <p class="backToLibraryText">Back To Explore</p>
        </a>

        <div class="row g-4 playlistInfoRow">
            <div class="col-12 col-xl-4 playlistCol left">
                <div class="playlistMetaRow">
                    <div class="albumPlaceholder"></div>
                </div>

               <div class="playlistMetaRow">
    <h2 class="playlistTitle">SAVED SONGS</h2>
</div>

<div class="playlistMetaRow">
    <p class="playlistSubtitle">Saved by <span class="userBold" id="savedUser">you</span></p>
</div>

<div class="playlistMetaRow">
    <p class="metaStats">Saved songs • <span class="accessStatus">Private</span></p>
</div>

<div class="playlistMetaRow">
    <p class="metaStats" id="savedCount">0 tracks</p>
</div>

                <div class="playlistMetaRow playlistBtns">
                    <button class="playBtn" onclick="playFunctionPlaceholder">
                        <i class="fa-solid fa-circle-play"></i>
                    </button>
                    <button class="shuffleBtn" onclick="shuffleFunctionPlaceholder">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button class="downloadBtn" onclick="downloadFunctionPlaceholder">
                        <i class="fa-regular fa-circle-down"></i>
                    </button>
                    <button class="shareBtn">
                        <i class="fa-solid fa-share"></i>
                    </button>
                </div>
            </div>

            <div class="col-12 col-xl-8 playlistCol right">
                <div class="playlistTable" role="table">
                    <div class="playlistTableHeader" role="row">
                        <div role="columnheader"><span class="visually-hidden">album cover</span></div>
                        <div role="columnheader">TITLE</div>
                        <div class="d-none d-md-block" role="columnheader">GENRE</div>
                        <div class="d-none d-md-block" role="columnheader">YEAR</div>
                        <div role="columnheader">RATING</div>
                        <div role="columnheader"><span class="visually-hidden">remove icon</span></div>
                    </div>

               <div class="playlistTableBody" id="savedSongsList" role="rowgroup"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

<!--Font Awesome-->
<script src="https://kit.fontawesome.com/1316822bd3.js" crossorigin="anonymous"></script>

<!--Javascript-->
<script src="../js/saved.js"></script>
</body>

</html>
