<body>

    <nav class="navbar navbar-expand-lg navbar-replay">
        <div class="container-fluid page-margin">
            <a class="navbar-brand logo" href="index.html">REPLAY</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto gap-lg-5">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pages/explore.html">Explore</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/pages/playlist.html">Library</a></li>
                </ul>

                <form class="search-form d-flex align-items-center me-lg-3 my-3 my-lg-0" role="search">
                    <input id="searchInput" class="form-control" type="search" placeholder="Search"
                        aria-label="Search" />
                </form>

                <a href="#" class="avatar" aria-label="Your profile">JM</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid page-margin playlistContainer">
        <a class="backToLibrary" href="../pages/landingP.html">
            <p>
                <i class="fa-solid fa-arrow-left"></i>
            </p>
            <p class="backToLibraryText">Back To Library</p>
        </a>

        <div class="playlistInfoRow">
            <div class="twoCol left">
                <div class="playlistMetaRow">
                    <div class="albumPlaceholder"></div>
                </div>

                <div class="playlistMetaRow">
                    <h2 class="playlistTitle">PLAYLIST TITLE</h2>
                </div>

                <div class="playlistMetaRow">
                    <p class="playlistSubtitle">Created by <span class="userBold">USER</span></p>
                </div>

                <div class="playlistMetaRow">
                    <p class="metaStats">Playlist • <span class="accessStatus">Private</span> • Last added <span
                            class="playlistEditedDate">YYYY</span></p>
                </div>

                <div class="playlistMetaRow">
                    <p class="metaStats">X tracks, ZZ minutes</p>
                </div>

                <div class="playlistMetaRow playlistBtns">
                    <button class="playBtn" onclick="playFunctionPlaceholder">
                        <i class="fa-solid fa-circle-play"></i>
                    </button>
                    <button class="shuffleBtn" onclick="shuffleFunctionPlaceholder">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button class="downloadBtn" onclick="downloadFunctionPlaceholder">
                        <i class="fa-regular fa-circle-down"></i>
                    </button>
                    <button class="shareBtn">
                        <i class="fa-solid fa-share"></i>
                    </button>
                </div>
            </div>

            <div class="twoCol right">
                <div class="playlistTable" role="table">
                    <div class="playlistTableHeader" role="row">
                        <div role="columnheader"><span class="visually-hidden">album cover</span></div>
                        <div role="columnheader">TITLE</div>
                        <div role="columnheader">GENRE</div>
                        <div role="columnheader">YEAR</div>
                        <div role="columnheader">RATING</div>
                        <div role="columnheader"><span class="visually-hidden">remove icon</span></div>
                    </div>

                    <div class="playlistTableBody" role="rowgroup">
                        <div class="playlistTableRow" role="row">
                            <div class="tableAlbum" role="cell">
                                <div class="albumIcon"></div>
                            </div>

                            <div class="tableTitle" role="cell">
                                <div class="songTitle">song title</div>
                                <div class="songArtist">artist</div>
                            </div>

                            <div class="tableGenre" role="cell">
                                <div class="songTableGenre">genre</div>
                            </div>

                            <div class="tableYear" role="cell">
                                <div class="songYear">2024</div>
                            </div>

                            <div class="tableRating" role="cell">
                                <div class="songRating">4.8</div>
                            </div>

                            <div class="tableRemove" role="cell">
                                <button class="removeBtn"><i class="fa-regular fa-circle-xmark"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

                <!--- <table class="playlistTable">
                    <tr class="tableHeadings">
                        <th aria-label="blankTableHeader"></th>
                        <th>TITLE</th>
                        <th>GENRE</th>
                        <th>YEAR</th>
                        <th>RATING</th>
                        <th aria-label="blankTableHeader"></th>
                    </tr>

                    <tr class="tableItem">
                        <td class="albumIcon"></td>
                        <td class="tableTitle"></td>
                        <td class="tableGenre"></td>
                        <td class="tableYear"></td>
                        <td class="tableRating"></td>
                        <td class="removeIcon"><i class="fa-regular fa-circle-xmark"></i></td>
                    </tr>
                </table>--->

        </div>
    </div>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    <!--Font Awesome-->

    <!--Javascript-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/searchbar.js"></script>

</body>

</html>
